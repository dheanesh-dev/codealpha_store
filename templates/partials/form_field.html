<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="check-label">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="error-text"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>{% endfor %}
</div>
