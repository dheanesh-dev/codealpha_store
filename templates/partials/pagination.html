{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}"><i class="fa-solid fa-chevron-left"></i> Prev</a>{% endif %}
  {% for n in page.paginator.page_range %}
    {% if n == page.number %}<span class="current">{{ n }}</span>
    {% else %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ n }}">{{ n }}</a>{% endif %}
  {% endfor %}
  {% if page.has_next %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Next <i class="fa-solid fa-chevron-right"></i></a>{% endif %}
</nav>
{% endif %}
